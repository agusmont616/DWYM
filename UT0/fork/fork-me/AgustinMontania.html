<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agustín Montaña Larralde</title>

  <style>
    /* Paleta general: fondo oscuro + texto en tonos púrpura */
    :root {
      --bg: #121014;
      --card-bg: #1c1a22;
      --purple: #b388ff;
      --purple-soft: #8e7ab5;
      --text: #e6e1f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
    }

    /* Tarjeta central con la info */
    .card {
      background-color: var(--card-bg);
      border: 1px solid #322d3d;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 30px rgba(179, 136, 255, 0.15);
    }

    h1 {
      color: var(--purple);
      margin-bottom: 0.5rem;
      font-size: 1.6rem;
    }

    .field {
      margin-top: 1.2rem;
      text-align: left;
    }

    .field span.label {
      display: block;
      color: var(--purple-soft);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.2rem;
    }

    .field a {
      color: var(--purple);
      text-decoration: none;
    }

    .field a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Agustín Montaña Larralde</h1>

    <div class="field">
      <span class="label">Github</span>
      <a href="https://github.com/agusmont616" target="_blank">agusmont616</a>
    </div>

    <div class="field">
      <span class="label">Bio</span>
      <p>me gusta tocar la guitarra y spiderman</p>
    </div>
  </div>

</body>
</html>
