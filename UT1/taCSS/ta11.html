<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class and ID Selectors</title>
    <link rel="stylesheet" href="ta11.css">
  </head>
  <body>
    <p class="elemento-impar">Number 1 - I'm a class!</p>
    <div id="segundo-elemento">Number 2 - I'm one ID.</div>
    <p class="elemento-impar tercer-elemento">Number 3 - I'm a class, but cooler!</p>
    <div id="cuarto-elemento">Number 4 - I'm another ID.</div>
    <p class="elemento-impar">Number 5 - I'm a class!</p>
  </body>
</html>

<!-- Checklist 
¿Los elementos imapres comparten una clase? -> sí, comparten la clase "elemento-impar"
¿Los elementos div pares tienen IDs únicos? -> sí, un sólo elemento puede llamarse "segundo-elemento
a diferencia de las clases, que se pueden tener varias en un mismo elemento
¿El elemento número 3 tiene múltiples clases? -> sí, tiene las clases "elemento-impar" y "tercer-elemento"
-->
